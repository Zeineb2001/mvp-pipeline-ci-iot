name: Generate IoT Configuration Artifact

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      projectName:
        description: "Project name"
        required: true
        default: "SmartFactory"
      deviceId:
        description: "Device ID"
        required: true
        default: "sensor-01"
      mqttHost:
        description: "MQTT host"
        required: true
        default: "mqtt.company.com"
      mqttPort:
        description: "MQTT port"
        required: true
        default: "1883"

jobs:
  generate-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Create config file
        run: |
          mkdir -p configs
          cat > configs/config.yaml <<EOF
          projectName: ${{ github.event.inputs.projectName || 'SmartFactory' }}
          deviceId: ${{ github.event.inputs.deviceId || 'sensor-01' }}
          protocol: MQTT
          mqtt:
            host: ${{ github.event.inputs.mqttHost || 'mqtt.company.com' }}
            port: ${{ github.event.inputs.mqttPort || '1883' }}
          monitoring: true
          security: true
          EOF

      - name: Launch CI pipeline
        run: python pipeline.py

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: iot-generated-configuration
          path: artifacts/*.zip